<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пятый элемент Outsource | Витрина специалистов</title>
    <meta
      name="description"
      content="Актуальная витрина доступных IT-специалистов Пятого элемента для партнеров: грейд, специализация, ставка, статус, CV и быстрый контакт в Telegram."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Пятый элемент">
        <img src="assets/logo-5element.svg" alt="Пятый элемент" />
      </a>
    </header>

    <main id="top">
      <section class="bench-section" id="bench" aria-labelledby="bench-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Актуальный Бенч</p>
            <h2 id="bench-title">Специалисты</h2>
          </div>
        </div>

        <div class="bench-toolbar" id="bench-toolbar" role="search" aria-label="Фильтры"></div>

        <div class="bench-table-wrap">
          <table class="bench-table">
            <thead>
              <tr>
                <th scope="col">Специалист</th>
                <th scope="col">Грейд</th>
                <th scope="col">Специализация</th>
                <th scope="col">Роль</th>
                <th scope="col">Ставка</th>
                <th scope="col">Опыт</th>
                <th scope="col">CV</th>
                <th scope="col">Коротко про опыт</th>
                <th scope="col">Контакт</th>
              </tr>
            </thead>
            <tbody id="bench-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div class="letter-modal" id="letter-modal" aria-hidden="true">
      <div class="modal-backdrop" data-modal-close></div>
      <section
        class="modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="letter-modal-title"
        tabindex="-1"
      >
        <button class="modal-close" type="button" data-modal-close aria-label="Закрыть сопроводительное письмо">
          ×
        </button>
        <h2 id="letter-modal-title">Сопроводительное письмо специалиста</h2>
        <p class="letter-text" id="letter-modal-text"></p>
      </section>
    </div>

    <footer class="site-footer">
      <div class="footer-inner">
        <a class="footer-brand" href="https://5-element.tech/" target="_blank" rel="noopener noreferrer" aria-label="Перейти на сайт Пятого элемента">
          <img src="assets/logo-5element.svg" alt="Пятый элемент" />
        </a>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
